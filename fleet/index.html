<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet · NeuroRover Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--panel:#0d0d0d;--panel2:#1a1a1a;--line:#333;--line2:#4a4a4a;--text:#e6e6e6;--dim:#8f8f8f;--faint:#5a5a5a;
--acc:#76b900;--green:#3ddc97;--amber:#f5b83d;--red:#ff5d6c;--blue:#5aa9ff;--violet:#a78bfa;--warn:#ffcc4d;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
/* product top bar (shared across the three pages) */
.topbar{display:flex;align-items:stretch;height:48px;background:#000;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
.tb-brand{display:flex;align-items:center;gap:10px;padding:0 18px;border-right:1px solid var(--line);font-weight:700;font-size:14px;letter-spacing:.01em;white-space:nowrap;color:#fff}
.tb-brand i{width:10px;height:10px;background:var(--acc);display:inline-block}
.tb-tabs{display:flex;align-items:stretch}
.tb-tabs a{display:flex;align-items:center;padding:0 16px;color:var(--dim);text-decoration:none;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border-bottom:2px solid transparent;margin-bottom:-1px}
.tb-tabs a:hover{color:#fff}
.tb-tabs a[aria-current="page"]{color:#fff;border-bottom-color:var(--acc)}
.tb-tabs a:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.tb-right{margin-left:auto;display:flex;align-items:center;padding:0 14px}
.sim-warning{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid #5e4a1a;background:rgba(255,204,77,.06);color:var(--warn);font:700 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.sim-warning::before{content:"";width:7px;height:7px;background:var(--warn)}
header{position:sticky;top:48px;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
display:flex;flex-wrap:wrap;align-items:stretch;gap:0;padding:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);padding:10px 18px;border-right:1px solid var(--line)}
.brand i{width:9px;height:9px;border-radius:0;background:var(--acc);box-shadow:0 0 0 0 rgba(118,185,0,.6);animation:pulse 2s infinite}
.brand i.off{background:var(--faint);animation:none}
.brand small{color:var(--dim);font-weight:400;font-family:var(--mono);font-size:10.5px;letter-spacing:0;text-transform:none}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(118,185,0,0)}100%{box-shadow:0 0 0 0 rgba(118,185,0,0)}}
.stats{display:flex;flex-wrap:wrap;gap:0;flex:1}
.stat{min-width:96px;padding:8px 16px;border-right:1px solid var(--line)}
.stat b{display:block;font:600 19px/1.15 var(--mono);font-variant-numeric:tabular-nums;color:#fff}
.stat:first-child b{color:var(--acc)}
.stat span{font-size:9px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.12em}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 18px}
button{font:600 11px Inter,sans-serif;letter-spacing:.04em;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:0;padding:8px 13px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--acc);border-color:var(--acc);color:#000;font-weight:700}
button.primary:hover:not(:disabled){background:#8ad400;border-color:#8ad400}
button.danger{border-color:#5a2630;color:#ff9aa4;background:#000}
button.danger:hover{border-color:var(--red)}
button.danger.arm{background:var(--red);border-color:var(--red);color:#1a0508}
main{padding:16px 18px 30px;max-width:1800px;margin:0 auto}
.launch{display:none;gap:12px;align-items:end;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--acc);border-radius:0;padding:14px;margin-bottom:16px}
.launch.open{display:flex}
label{display:grid;gap:4px;font-size:9.5px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.12em}
input{font:13px var(--mono);background:#000;color:var(--text);border:1px solid var(--line2);border-radius:0;padding:7px 9px;width:150px}
input[type=number]{width:84px}
.banner{display:none;margin-bottom:14px;padding:9px 13px;border-radius:0;border:1px solid #5a2630;border-left:3px solid var(--red);background:#140709;color:#ffb3ba;font:12px var(--mono)}
.overall{display:flex;align-items:center;gap:12px;margin-bottom:14px;color:var(--dim);font:11px var(--mono)}
.overall .bar{flex:1;height:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.grid:empty{display:none}
.card{background:var(--panel);border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;padding:12px 14px;min-width:0}
.card.hot{box-shadow:inset 0 2px 0 var(--acc)}
.card h3{margin:0;display:flex;align-items:center;gap:8px;font:600 13px var(--mono);color:#fff}
.card h3 .id{color:var(--faint);font-weight:400;font-size:11px;margin-left:auto}
.pill{font:600 9.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:0;border:1px solid}
.pill.running{color:var(--acc);border-color:#3f6200;background:rgba(118,185,0,.08)}
.pill.starting,.pill.installing,.pill.uploading{color:var(--amber);border-color:#5e4a1a;background:rgba(245,184,61,.08)}
.pill.done{color:var(--blue);border-color:#234a7a;background:rgba(90,169,255,.08)}
.pill.other{color:var(--dim);border-color:var(--line2)}
.pill.bad{color:var(--red);border-color:#5a2630;background:rgba(255,93,108,.08)}
.meta{display:flex;gap:12px;margin:7px 0 9px;font:11px var(--mono);color:var(--dim);flex-wrap:wrap}
.meta b{color:var(--text);font-weight:500}
.row{display:grid;grid-template-columns:62px 1fr 78px;gap:9px;align-items:center;margin:6px 0;font:11px var(--mono);color:var(--dim)}
.row .v{text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:0;background:#222;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:0;background:var(--acc);transition:width .6s ease}
.bar.mem>i{background:var(--violet)}
.bar.all>i{background:var(--acc)}
svg.spark{width:100%;height:30px;display:block}
pre{margin:9px 0 0;padding:8px 9px;background:#000;border:1px solid var(--line);border-radius:0;font:10.5px/1.5 var(--mono);color:#a8a8a8;
height:92px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.empty{border:1px dashed var(--line2);border-radius:0;padding:56px 20px;text-align:center;color:var(--dim);background:var(--panel)}
.empty b{display:block;color:#fff;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
h2{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:#cfcfcf;margin:24px 0 0;padding:7px 12px;background:#000;border:1px solid var(--line);border-bottom:0}
#events{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:9px 12px;height:210px;overflow:auto;font:11px/1.65 var(--mono)}
#events div{white-space:pre-wrap;word-break:break-word}
#events time{color:var(--faint);margin-right:9px}
.ok{color:var(--acc)}.error{color:var(--red)}.warn{color:var(--amber)}.info{color:#b0b0b0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:760px){.topbar{flex-wrap:wrap;height:auto}.tb-brand{height:44px}.tb-tabs{order:3;width:100%;border-top:1px solid var(--line);overflow-x:auto}.tb-tabs a{height:40px}header{position:static}main{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="topbar" aria-label="NeuroRover Sim">
  <div class="tb-brand"><i aria-hidden="true"></i>NeuroRover Sim</div>
  <div class="tb-tabs">
    <a href="http://localhost:8765/index.html">Simulate</a>
    <a href="http://localhost:8765/lab.html">Lab console</a>
    <a href="/" aria-current="page">Fleet</a>
  </div>
  <div class="tb-right"><div class="sim-warning">Simulated culture — no living neurons</div></div>
</nav>
<header>
  <div class="brand"><i id="dot" class="off"></i>Fleet <small id="fresh">connecting</small></div>
  <div class="stats">
    <div class="stat"><b id="sRun">0</b><span>running / 10</span></div>
    <div class="stat"><b id="sCpu">0</b><span>vCPUs</span></div>
    <div class="stat"><b id="sLoad">0.0</b><span>total load</span></div>
    <div class="stat"><b id="sRes">0</b><span>results</span></div>
    <div class="stat"><b id="sRate">$0.00</b><span>per hour</span></div>
    <div class="stat"><b id="sSpent">$0.00</b><span>since launch</span></div>
    <div class="stat"><b id="sUp">--</b><span>uptime</span></div>
  </div>
  <div class="actions">
    <button class="primary" id="bLaunch">Launch</button>
    <button id="bCollect">Collect</button>
    <button class="danger" id="bTear">Teardown</button>
    <button id="bCancel" style="display:none">Cancel</button>
  </div>
</header>
<main>
  <div class="banner" id="banner"></div>
  <form class="launch" id="launchForm">
    <label>VMs (max 10)<input type="number" id="fN" min="1" max="10" value="10"></label>
    <label>Condition<input id="fC" value="culture_teach"></label>
    <label>Seeds<input type="number" id="fS" min="1" value="50"></label>
    <label>Tag (optional)<input id="fT" placeholder=""></label>
    <button class="primary" type="submit">Start shards</button>
    <button type="button" id="fX">Close</button>
  </form>
  <div class="overall" id="overall" style="display:none"><span id="oTxt"></span><div class="bar all"><i id="oBar" style="width:0"></i></div><span id="oPct"></span></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"><b>No VMs running</b>The fleet is empty. Press Launch to fan benchmark shards out over Freestyle VMs.</div>
  <h2>Activity</h2>
  <div id="events"></div>
</main>
<script>
const $=id=>document.getElementById(id), hist={}, esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let lastOk=0, armT=null;
const money=x=>'$'+x.toFixed(2);
function dur(s){s=Math.max(0,s|0);const h=s/3600|0,m=(s%3600)/60|0;return h?h+'h '+m+'m':m+'m '+(s%60)+'s'}
function spark(a,max){
  if(a.length<2)return '<svg class="spark"></svg>';
  const W=200,H=30,m=Math.max(max,...a,0.1);
  const pts=a.map((v,i)=>[(i/(a.length-1))*W,H-2-(v/m)*(H-5)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${line} L${W} ${H} L0 ${H} Z" fill="rgba(90,169,255,.13)"/><path d="${line}" fill="none" stroke="#5aa9ff" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function card(v){
  const p=v.probe||{}, st=String(v.state||'unknown').toLowerCase();
  const nproc=p.nproc||4, load=p.load?p.load[0]:null, res=p.results??0, exp=v.expected||0;
  const h=hist[v.id]||(hist[v.id]=[]);
  if(load!=null&&p.ts!==h.ts){h.push(load);h.ts=p.ts;if(h.length>60)h.shift()}
  let phase=st, cls=st==='running'?'running':'other';
  if(st==='running'&&p.ok){
    if(p.procs>0){phase='computing'}
    else if(exp&&res>=exp){phase='done';cls='done'}
    else if(v.phase&&v.phase!=='running'){phase=v.phase;cls=/fail/.test(phase)?'bad':'installing'}
    else {phase='idle';cls='other'}
  } else if(st==='running'&&v.phase){phase=v.phase;cls=/fail/.test(phase)?'bad':'installing'}
  else if(st==='starting')cls='starting';
  const pct=exp?Math.min(100,res/exp*100):0, mp=p.mem_total_mb?p.mem_used_mb/p.mem_total_mb*100:0;
  const log=(p.log&&p.log.length)?p.log.map(esc).join('\n'):(p.error?esc(p.error):'waiting for log output...');
  return `<article class="card ${p.procs>0?'hot':''}">
  <h3>${esc(v.slug||'(no slug)')}<span class="pill ${cls}">${esc(phase)}</span><span class="id">${esc(String(v.id).replace('vm-','').slice(0,8))}</span></h3>
  <div class="meta"><span>shard <b>${v.shard!=null?v.shard+'/'+v.nshards:'-'}</b></span><span>procs <b>${p.procs??'-'}</b></span><span>cpus <b>${p.nproc??'-'}</b></span>${p.stale?'<span class="warn">stale</span>':''}</div>
  <div class="row"><span>progress</span><div class="bar"><i style="width:${pct}%"></i></div><span class="v">${res}${exp?' / '+exp:''}</span></div>
  <div class="row"><span>memory</span><div class="bar mem"><i style="width:${mp}%"></i></div><span class="v">${p.mem_total_mb?(p.mem_used_mb/1024).toFixed(1)+' / '+(p.mem_total_mb/1024).toFixed(1)+'G':'-'}</span></div>
  <div class="row"><span>load 1m</span>${spark(h,nproc)}<span class="v">${load!=null?load.toFixed(2):'-'}</span></div>
  <pre>${log}</pre></article>`;
}
async function poll(){
  try{
    const d=await (await fetch('/api/vms')).json(); lastOk=Date.now();
    const vms=(d.vms||[]).slice().sort((a,b)=>String(a.slug||'').localeCompare(String(b.slug||''),undefined,{numeric:true}));
    const run=vms.filter(v=>String(v.state).toLowerCase()==='running');
    const price=d.price_per_vm_hour||0.27, L=d.launch;
    let cpus=0,load=0,res=0,exp=0;
    vms.forEach(v=>{const p=v.probe||{};if(String(v.state).toLowerCase()==='running')cpus+=p.nproc||4;load+=p.load?p.load[0]:0;res+=p.results||0;exp+=v.expected||0});
    $('sRun').textContent=d.runningCount??run.length; $('sCpu').textContent=cpus; $('sLoad').textContent=load.toFixed(1);
    $('sRes').textContent=exp?res+'/'+exp:res; $('sRate').textContent=money(run.length*price);
    const up=L&&L.launched_at&&run.length?d.now-L.launched_at:0;
    $('sSpent').textContent=money(up/3600*price*run.length); $('sUp').textContent=up?dur(up):'--';
    $('dot').className=run.length?'':'off';
    $('grid').innerHTML=vms.map(card).join(''); $('empty').style.display=vms.length?'none':'block';
    $('overall').style.display=exp?'flex':'none';
    if(exp){$('oTxt').textContent=(L?L.condition+' x '+L.seeds+' seeds':'sweep');$('oBar').style.width=(res/exp*100)+'%';$('oPct').textContent=res+' / '+exp+' ('+(res/exp*100).toFixed(0)+'%)'}
    $('bLaunch').disabled=!!d.busy; $('bLaunch').textContent=d.busy?'Launching...':'Launch';
    const b=$('banner'); b.style.display=d.error?'block':'none'; b.textContent=d.error?'vm list failed: '+d.error:'';
    document.querySelectorAll('pre').forEach(p=>p.scrollTop=p.scrollHeight);
  }catch(e){const b=$('banner');b.style.display='block';b.textContent='server unreachable: '+e.message}
}
async function events(){
  try{
    const d=await (await fetch('/api/events')).json(), el=$('events'), stick=el.scrollTop+el.clientHeight>=el.scrollHeight-20;
    el.innerHTML=d.events.map(e=>`<div class="${esc(e.level)}"><time>${new Date(e.t*1000).toLocaleTimeString()}</time>${esc(e.msg)}</div>`).join('')||'<div class="info">no activity yet</div>';
    if(stick)el.scrollTop=el.scrollHeight;
  }catch(e){}
}
function tick(){$('fresh').textContent=lastOk?'updated '+((Date.now()-lastOk)/1000|0)+'s ago':'connecting'}
async function post(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({}));if(!r.ok){const b=$('banner');b.style.display='block';b.textContent=path+': '+(j.error||r.status)}events();return r.ok}
$('bLaunch').onclick=()=>$('launchForm').classList.toggle('open');
$('fX').onclick=()=>$('launchForm').classList.remove('open');
$('launchForm').onsubmit=async e=>{e.preventDefault();
  if(await post('/api/launch',{n_vms:+$('fN').value,condition:$('fC').value.trim(),seeds:+$('fS').value,tag:$('fT').value.trim()}))$('launchForm').classList.remove('open')};
$('bCollect').onclick=()=>post('/api/collect');
function disarm(){clearTimeout(armT);const b=$('bTear');b.classList.remove('arm');b.textContent='Teardown';$('bCancel').style.display='none'}
$('bTear').onclick=()=>{const b=$('bTear');
  if(!b.classList.contains('arm')){b.classList.add('arm');b.textContent='Confirm: delete all nr-fleet VMs';$('bCancel').style.display='';armT=setTimeout(disarm,6000);return}
  disarm();post('/api/teardown')};
$('bCancel').onclick=disarm;
poll();events();setInterval(poll,5000);setInterval(events,3000);setInterval(tick,1000);
</script>
</body>
</html>
